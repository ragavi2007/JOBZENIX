<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobzenix — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;--bg2:#080e1c;--bg3:#0d1424;
  --teal:#00e5b8;--teal2:#00ffcc;--teal-dim:rgba(0,229,184,0.1);--teal-bdr:rgba(0,229,184,0.15);
  --orange:#ff5c35;--orange-dim:rgba(255,92,53,0.1);
  --gold:#ffd166;--gold-dim:rgba(255,209,102,0.1);
  --green:#22c97e;--green-dim:rgba(34,201,126,0.1);
  --white:#eef2ff;--grey:#7a869a;--grey2:#3a4255;
  --bdr:rgba(255,255,255,0.07);--card:rgba(255,255,255,0.03);
  --sidebar:220px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);overflow:hidden}

/* INTRO ANIMATION */
#intro{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease}
#intro.hide{opacity:0;pointer-events:none}
.intro-logo{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:var(--teal);letter-spacing:-2px;animation:logoPop .7s cubic-bezier(0.175,0.885,0.32,1.275) .3s both}
.intro-logo span{color:var(--orange)}
@keyframes logoPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.intro-bar-wrap{width:280px;height:3px;background:rgba(255,255,255,0.07);border-radius:3px;margin-top:32px;overflow:hidden;animation:fadeIn .4s ease .7s both}
.intro-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:3px;animation:loadBar 1.6s ease .9s both}
@keyframes loadBar{from{width:0}to{width:100%}}
.intro-msg{margin-top:18px;font-size:14px;color:var(--grey);animation:fadeIn .4s ease 1s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* LAYOUT */
.app{display:flex;height:100vh;position:relative;z-index:1;opacity:0;transition:opacity .5s ease}
.app.show{opacity:1}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;
  padding:0;overflow-y:auto;overflow-x:hidden;
  position:relative;z-index:10;
  animation:sideIn .6s cubic-bezier(0.16,1,0.3,1) .1s both
}
@keyframes sideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.sb-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--teal);padding:26px 22px 20px;border-bottom:1px solid var(--bdr)}
.sb-logo span{color:var(--orange)}
.sb-user{display:flex;align-items:center;gap:10px;padding:16px 22px 14px;border-bottom:1px solid var(--bdr)}
.sb-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#04080f;flex-shrink:0}
.sb-uname{font-size:13px;font-weight:600;color:var(--white);line-height:1.2}
.sb-urole{font-size:11px;color:var(--grey)}
.sb-section{padding:16px 14px 6px;font-size:10.5px;font-weight:700;color:var(--grey2);letter-spacing:1.5px;text-transform:uppercase}
.sb-nav{list-style:none;padding:0 10px}
.sb-nav li a{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:500;color:var(--grey);
  text-decoration:none;transition:all .2s;cursor:pointer;margin-bottom:2px
}
.sb-nav li a:hover{background:var(--card);color:var(--white)}
.sb-nav li a.active{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-bdr)}
.sb-nav li a .ico{font-size:17px;width:22px;text-align:center}
.sb-nav li a .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.sb-bottom{margin-top:auto;padding:14px 10px;border-top:1px solid var(--bdr)}
.sb-bottom a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-size:13.5px;color:var(--grey);text-decoration:none;transition:all .2s}
.sb-bottom a:hover{background:rgba(255,92,53,0.08);color:var(--orange)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOP BAR */
.topbar{
  height:62px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  background:rgba(8,14,28,0.95);
  border-bottom:1px solid var(--bdr);
  animation:topIn .5s cubic-bezier(0.16,1,0.3,1) .2s both
}
@keyframes topIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.tb-left h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.4px}
.tb-left p{font-size:12.5px;color:var(--grey);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--bdr);color:var(--grey);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.tb-btn:hover{background:var(--teal-dim);border-color:var(--teal-bdr);color:var(--teal)}
.tb-btn.primary{background:var(--teal);color:#04080f;border-color:transparent;font-weight:700}
.tb-btn.primary:hover{background:var(--teal2);transform:translateY(-1px)}
.notif-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--card);border:1px solid var(--bdr);cursor:pointer;font-size:18px;transition:all .2s}
.notif-btn:hover{background:var(--teal-dim);border-color:var(--teal-bdr)}
.notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--orange);border-radius:50%;border:2px solid var(--bg2)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px;animation:contentIn .6s cubic-bezier(0.16,1,0.3,1) .35s both}
@keyframes contentIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--grey2);border-radius:3px}

/* GRID LAYOUTS */
.row{display:flex;gap:20px;flex-wrap:wrap}
.row.r4>*{flex:1;min-width:180px}
.row.r3>*{flex:1;min-width:220px}
.row.r2>*{flex:1;min-width:300px}

/* STAT CARDS */
.stat-card{
  background:var(--bg3);border:1px solid var(--bdr);border-radius:16px;padding:20px;
  display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;
  transition:all .3s ease
}
.stat-card:hover{border-color:rgba(0,229,184,0.18);transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,0.3)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px}
.sc-teal::before{background:linear-gradient(90deg,var(--teal),transparent)}
.sc-orange::before{background:linear-gradient(90deg,var(--orange),transparent)}
.sc-gold::before{background:linear-gradient(90deg,var(--gold),transparent)}
.sc-green::before{background:linear-gradient(90deg,var(--green),transparent)}
.stat-card .icon{font-size:24px;margin-bottom:8px}
.stat-card .label{font-size:12px;color:var(--grey);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
.stat-card .value{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;letter-spacing:-1px;margin:2px 0}
.stat-card .change{font-size:12px;display:flex;align-items:center;gap:4px}
.up{color:var(--green)}.down{color:var(--orange)}.neutral{color:var(--grey)}

/* CARD BASE */
.card{background:var(--bg3);border:1px solid var(--bdr);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card-hdr{display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:'Syne',sans-serif;font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.card-action{font-size:12.5px;color:var(--teal);cursor:pointer;transition:opacity .2s;text-decoration:none}
.card-action:hover{opacity:.7}

/* RESUME SCORE RING */
.score-section{display:flex;align-items:center;gap:22px}
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.ring-wrap svg{width:100%;height:100%}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--teal)}
.ring-lbl{font-size:10px;color:var(--grey)}
.score-details{flex:1}
.score-bar-row{display:flex;flex-direction:column;gap:8px}
.sbr{display:flex;align-items:center;gap:10px}
.sbr-label{font-size:12px;color:var(--grey);width:80px;flex-shrink:0}
.sbr-bar{flex:1;height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.sbr-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(0.16,1,0.3,1)}
.sbr-val{font-size:11.5px;font-weight:600;width:30px;text-align:right}

/* CHART */
.chart-container{height:130px;display:flex;align-items:flex-end;gap:6px;position:relative}
.chart-container::before{content:'';position:absolute;left:0;right:0;bottom:20px;height:1px;background:var(--bdr)}
.bar-grp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.bar-v{
  width:100%;border-radius:5px 5px 0 0;
  background:linear-gradient(180deg,var(--teal),rgba(0,229,184,0.3));
  transition:height 1.2s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;position:relative
}
.bar-v.dim{background:rgba(255,255,255,0.07)}
.bar-v:hover{filter:brightness(1.2)}
.bar-v .tooltip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--teal-bdr);
  padding:4px 9px;border-radius:7px;font-size:11px;color:var(--teal);
  white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none
}
.bar-v:hover .tooltip{opacity:1}
.bar-day{font-size:10.5px;color:var(--grey)}

/* ACTIVITY FEED */
.feed-list{display:flex;flex-direction:column;gap:1px}
.feed-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;transition:background .2s;cursor:pointer}
.feed-item:hover{background:rgba(255,255,255,0.03)}
.fi-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.fi-teal{background:var(--teal-dim)} .fi-orange{background:var(--orange-dim)} .fi-gold{background:var(--gold-dim)} .fi-green{background:var(--green-dim)}
.fi-info{flex:1}
.fi-info .fi-title{font-size:13.5px;font-weight:500;color:var(--white);margin-bottom:2px}
.fi-info .fi-sub{font-size:12px;color:var(--grey)}
.fi-time{font-size:11.5px;color:var(--grey2)}
.fi-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.fb-green{background:var(--green-dim);color:var(--green)}.fb-teal{background:var(--teal-dim);color:var(--teal)}.fb-orange{background:var(--orange-dim);color:var(--orange)}.fb-gold{background:var(--gold-dim);color:var(--gold)}

/* JOB CARDS */
.job-card{
  background:rgba(255,255,255,0.025);border:1px solid var(--bdr);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;
  transition:all .2s;cursor:pointer
}
.job-card:hover{background:var(--teal-dim);border-color:var(--teal-bdr);transform:translateX(3px)}
.jc-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.jc-info{flex:1}
.jc-title{font-size:14px;font-weight:600;color:var(--white);margin-bottom:2px}
.jc-company{font-size:12px;color:var(--grey)}
.jc-match{font-size:12px;font-weight:700;color:var(--teal)}
.jc-tag{display:flex;gap:6px;margin-top:6px}
.jtag{font-size:10.5px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.05);color:var(--grey)}

/* AI CHAT */
.ai-chat{background:linear-gradient(160deg,rgba(8,14,28,0.9),rgba(13,20,36,0.9));border:1px solid var(--teal-bdr);border-radius:16px;padding:0;overflow:hidden;display:flex;flex-direction:column;height:650px}
.chat-hdr{padding:14px 18px;background:rgba(0,229,184,0.06);border-bottom:1px solid var(--teal-bdr);display:flex;align-items:center;gap:10px}
.chat-av{width:30px;height:30px;background:linear-gradient(135deg,var(--teal),var(--teal2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.chat-name{font-size:13px;font-weight:600;color:var(--white)}
.chat-status{font-size:11px;color:var(--teal);display:flex;align-items:center;gap:5px}
.chat-dot{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-body::-webkit-scrollbar{width:3px}
.chat-body::-webkit-scrollbar-thumb{background:var(--grey2);border-radius:2px}
.msg{max-width:88%;line-height:1.6;font-size:13px;padding:10px 14px;border-radius:12px}
.msg.ai{background:rgba(255,255,255,0.06);color:var(--white);border-radius:12px 12px 12px 2px;align-self:flex-start}
.msg.user{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-bdr);border-radius:12px 12px 2px 12px;align-self:flex-end;text-align:right}
.typing{display:flex;gap:4px;padding:10px 14px;background:rgba(255,255,255,0.06);border-radius:12px 12px 12px 2px;align-self:flex-start}
.td{width:5px;height:5px;background:var(--teal);border-radius:50%;opacity:.5;animation:typ 1.2s ease infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}
.chat-inp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--bdr)}
.chat-inp input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--bdr);border-radius:10px;padding:9px 14px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.chat-inp input:focus{border-color:var(--teal)}
.chat-inp input::placeholder{color:var(--grey2)}
.chat-send{width:36px;height:36px;background:var(--teal);border:none;border-radius:10px;cursor:pointer;font-size:15px;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-send:hover{background:var(--teal2);transform:scale(1.05)}

/* TABS */
.tab-bar{display:flex;gap:4px;background:rgba(255,255,255,0.03);padding:4px;border-radius:12px;border:1px solid var(--bdr);width:fit-content}
.tab{font-size:13px;color:var(--grey);padding:7px 16px;border-radius:9px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.tab.on{background:var(--teal-dim);color:var(--teal);font-weight:600;border:1px solid var(--teal-bdr)}

/* CALENDAR */
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hdr{font-size:10px;color:var(--grey2);text-align:center;padding:4px 0;font-weight:600}
.cal-day{font-size:11.5px;text-align:center;padding:6px 4px;border-radius:7px;cursor:pointer;transition:all .2s;color:var(--grey)}
.cal-day:hover{background:var(--card);color:var(--white)}
.cal-day.today{background:var(--teal);color:#04080f;font-weight:700}
.cal-day.has-event{position:relative}.cal-day.has-event::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--orange);border-radius:50%}
.cal-day.other{opacity:.3}

/* PROGRESS RING ANIM */
@keyframes dash{from{stroke-dashoffset:var(--start)}to{stroke-dashoffset:var(--end)}}

/* ── NEW: WELCOME BOT OVERLAY ── */
#welcomeOverlay{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,15,0.82);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
#welcomeOverlay.show{opacity:1;pointer-events:all}
.welcome-card{
  background:var(--bg2);border:1px solid var(--teal-bdr);border-radius:20px;
  padding:36px 32px;max-width:420px;width:90%;text-align:center;
  box-shadow:0 0 60px rgba(0,229,184,0.12);
  transform:translateY(30px) scale(0.95);
  transition:transform .4s cubic-bezier(0.16,1,0.3,1);
}
#welcomeOverlay.show .welcome-card{transform:translateY(0) scale(1)}
.wc-bot-icon{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:0 auto 18px;
  box-shadow:0 0 30px rgba(0,229,184,0.3);
}
.wc-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:8px}
.wc-title span{color:var(--teal)}
.wc-msg{font-size:14px;color:var(--grey);line-height:1.7;margin-bottom:24px}
.wc-btn-row{display:flex;gap:12px;justify-content:center}
.wc-btn{padding:11px 32px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;}
.wc-yes{background:var(--teal);color:#04080f}
.wc-yes:hover{background:var(--teal2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,229,184,0.3)}
.wc-no{background:rgba(255,255,255,0.06);color:var(--grey);border:1px solid var(--bdr)}
.wc-no:hover{background:rgba(255,255,255,0.1);color:var(--white)}

/* ── NEW: OPTIONS PANEL ── */
#optionsPanel{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,15,0.82);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
#optionsPanel.show{opacity:1;pointer-events:all}
.op-card{
  background:var(--bg2);border:1px solid var(--teal-bdr);
  border-radius:20px;padding:32px 28px;max-width:480px;width:90%;
  box-shadow:0 0 60px rgba(0,229,184,0.1);
  transform:translateY(30px) scale(0.95);
  transition:transform .4s cubic-bezier(0.16,1,0.3,1);
}
#optionsPanel.show .op-card{transform:translateY(0) scale(1)}
.op-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;margin-bottom:6px}
.op-sub{font-size:13px;color:var(--grey);margin-bottom:20px}
.op-grid{display:flex;flex-direction:column;gap:10px}
.op-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,0.03);border:1px solid var(--bdr);
  cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;
}
.op-item:hover{background:var(--teal-dim);border-color:var(--teal-bdr);transform:translateX(4px)}
.op-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.oi-teal{background:var(--teal-dim)}.oi-orange{background:var(--orange-dim)}.oi-gold{background:var(--gold-dim)}.oi-green{background:var(--green-dim)}
.op-info{flex:1}
.op-label{font-size:14px;font-weight:600;color:var(--white);margin-bottom:2px}
.op-desc{font-size:12px;color:var(--grey)}
.op-arrow{font-size:16px;color:var(--grey2)}
.op-close{margin-top:16px;text-align:center;font-size:13px;color:var(--grey);cursor:pointer;transition:color .2s}
.op-close:hover{color:var(--white)}

/* ── NEW: FULL AI CHAT PANEL ── */
#aiChatPanel{
  position:fixed;inset:0;z-index:600;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
#aiChatPanel.show{opacity:1;pointer-events:all}
.acp-bg{position:absolute;inset:0;background:rgba(4,8,15,0.9);backdrop-filter:blur(6px)}
.acp-box{
  position:relative;z-index:1;width:100%;max-width:680px;
  background:var(--bg2);border:1px solid var(--teal-bdr);
  border-radius:24px;display:flex;flex-direction:column;
  height:82vh;box-shadow:0 0 80px rgba(0,229,184,0.12);
  transform:translateY(40px);transition:transform .4s cubic-bezier(0.16,1,0.3,1);
}
#aiChatPanel.show .acp-box{transform:translateY(0)}
.acp-hdr{
  padding:16px 20px;background:rgba(0,229,184,0.06);
  border-bottom:1px solid var(--teal-bdr);
  display:flex;align-items:center;gap:12px;border-radius:24px 24px 0 0;
}
.acp-av{width:36px;height:36px;background:linear-gradient(135deg,var(--teal),var(--teal2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.acp-info{flex:1}
.acp-name{font-size:14px;font-weight:700;font-family:'Syne',sans-serif;color:var(--white)}
.acp-status{font-size:11.5px;color:var(--teal);display:flex;align-items:center;gap:5px}
.acp-dot{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:blink 2s ease infinite}
.acp-close{width:32px;height:32px;background:rgba(255,255,255,0.05);border:1px solid var(--bdr);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--grey);transition:all .2s}
.acp-close:hover{background:rgba(255,92,53,0.1);border-color:var(--orange);color:var(--orange)}
.acp-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.acp-body::-webkit-scrollbar{width:3px}
.acp-body::-webkit-scrollbar-thumb{background:var(--grey2);border-radius:2px}
.acp-msg{max-width:86%;line-height:1.65;font-size:13.5px;padding:11px 15px;border-radius:14px}
.acp-msg.ai{background:rgba(255,255,255,0.06);color:var(--white);border-radius:14px 14px 14px 3px;align-self:flex-start}
.acp-msg.user{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-bdr);border-radius:14px 14px 3px 14px;align-self:flex-end;text-align:right}
.acp-typing{display:flex;gap:4px;padding:11px 15px;background:rgba(255,255,255,0.06);border-radius:14px 14px 14px 3px;align-self:flex-start}
.acp-inp{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--bdr)}
.acp-inp input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--bdr);border-radius:12px;padding:10px 15px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;transition:border-color .2s}
.acp-inp input:focus{border-color:var(--teal)}
.acp-inp input::placeholder{color:var(--grey2)}
.acp-send{width:40px;height:40px;background:var(--teal);border:none;border-radius:11px;cursor:pointer;font-size:15px;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acp-send:hover{background:var(--teal2);transform:scale(1.05)}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-logo">Job<span>zenix</span></div>
  <div class="intro-bar-wrap"><div class="intro-bar"></div></div>
  <div class="intro-msg">Loading your career dashboard...</div>
</div>

<!-- ══ NEW: WELCOME BOT OVERLAY ══ -->


<!-- ══ NEW: OPTIONS PANEL ══ -->

<!-- ══ NEW: FULL AI CHAT PANEL ══ -->

<div class="app" id="app">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sb-logo">Job<span>zenix</span></div>
    <div class="sb-user">
      <div class="sb-av" id="sbAv">U</div>
      <div>
        <div class="sb-uname" id="sbName">Loading...</div>
        <div class="sb-urole">Job Seeker</div>
      </div>
    </div>
    <div class="sb-section">Career Tools</div>

    <ul class="sb-nav">
      <li><a class="active" onclick="setPage('dashboard')"><span class="ico"></span> Dashboard</a></li>
      <li><a href="resumebuilder"><span class="ico"></span> Resume Builder</a></li>
      <li><a href="atschecker"><span class="ico"></span> ATS Checker</a></li>
      <li><a href="mockinterview"><span class="ico"></span> Mock Interview</a></li>
      <li><a href="certificateverifier"><span class="ico"></span> Certificate Verification</a></li>
      <li><a href="skillgapanalyzer"><span class="ico"></span> Skill Gap Analysis</a></li>
    </ul>

    <div class="sb-section">Account</div>

    <ul class="sb-nav">
      <li><a href="profile"><span class="ico"></span> Profile</a></li>
    </ul>
    <div class="sb-bottom">
      <a href="login"><span class="ico"></span> Sign Out</a>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageDate"></p>
      </div>
    </div>

    <!-- ══ BLANK SPACE — CHATBOT ADDED HERE ══ -->
    <div class="content" id="dashContent" style="align-items:center;justify-content:center;">
      <div class="ai-chat" style="width:100%;max-width:700px;">
        <div class="chat-hdr">
          <div class="chat-av">🤖</div>
          <div>
            <div class="chat-name">Zenix AI Assistant</div>
            <div class="chat-status"><span class="chat-dot"></span> Online</div>
          </div>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-inp">
          <input type="text" id="chatInput" placeholder="Ask me anything about your career..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="chat-send" onclick="sendChat()">➤</button>
        </div>
      </div>
    </div>
    <!-- ══ END NEW CONTENT ══ -->

  </div>
</div>

<script>
// INIT — original code unchanged
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if (!currentUser) {
  window.location.href = "user-login.html";
}

window.addEventListener('DOMContentLoaded', () => {
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));
  const name = currentUser?.name || "User";
  const initials = name.slice(0,2).toUpperCase();
  document.getElementById('sbAv').textContent = initials;
  document.getElementById('sbName').textContent = name.charAt(0).toUpperCase() + name.slice(1);

  // Welcome overlay name
  

  const now = new Date();
  const hrs = now.getHours();
  const greet = hrs < 12 ? 'Good morning' : hrs < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('pageDate').textContent = `${greet}, ${name} · ${now.toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric'})}`;

  // Remove intro after load — original logic unchanged
  setTimeout(() => {
    document.getElementById('intro').classList.add('hide');
    setTimeout(() => {
      document.getElementById('intro').style.display = 'none';
      document.getElementById('app').classList.add('show');
      // Animate bars
      setTimeout(() => {
        document.querySelectorAll('.bar-v').forEach((b,i) => {
          setTimeout(() => { b.style.height = b.dataset.h || '50%'; }, i * 80);
        });
        document.querySelectorAll('.sbr-fill').forEach((f, i) => {
          setTimeout(() => { f.style.width = f.dataset.w || '0%'; }, i * 150 + 200);
        });
        // Show welcome bot after app appears
        // Direct chatbot welcome message
setTimeout(() => {
  addInlineMsg(
    "Hi " +
    (name.charAt(0).toUpperCase() + name.slice(1)) +
    "! 👋 I'm Zenix AI. Ask me anything about your career."
  );
}, 600);
      }, 200);
    }, 600);
  }, 2400);
});

// SIDEBAR NAV — original code unchanged
function setPage(p) {
  document.querySelectorAll('.sb-nav a').forEach(a => a.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const titles = {dashboard:'Dashboard',resume:'Resume Builder',interview:'Interview Prep',jobs:'Job Matches',tracker:'Job Tracker',analytics:'Analytics',cover:'Cover Letters',profile:'Profile',settings:'Settings'};
  document.getElementById('pageTitle').textContent = titles[p] || p;
}

// TABS — original code unchanged
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    t.closest('.tab-bar').querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
  });
});

// ORIGINAL AI CHAT replies — unchanged
function sendChat() {
  const inp = document.getElementById('chatInput');
  const msg = inp.value.trim().toLowerCase();
  if (!msg) return;

  const body = document.getElementById('chatBody');

  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  userMsg.textContent = inp.value;
  body.appendChild(userMsg);

  inp.value = '';

  const aiMsg = document.createElement('div');
  aiMsg.className = 'msg ai';

  if (msg.includes("yes")) {
    aiMsg.innerHTML = `
      Great! Choose an option:<br><br>

      <a href="resumebuilder">1️⃣ Resume Builder</a><br>
      <a href="atschecker">2️⃣ ATS Checker</a><br>
      <a href="mockinterview">3️⃣ Mock Interview</a><br>
      <a href="certificateverifier">4️⃣ Certificate Verification</a><br>
      <a href="skillgapanalyzer">5️⃣ Skill Gap Analyzer</a>
    `;
  }
  else if (msg.includes("no")) {
    aiMsg.textContent =
      "Thank you! 😊 If you need help later, just ask me anytime.";
  }
  else {
    aiMsg.textContent =
      "Welcome to Jobzenix! 👋 Need assistance? Please type Yes or No.";
  }

  body.appendChild(aiMsg);
  body.scrollTop = body.scrollHeight;
}

// ── NEW: inline chat welcome msg ──
function addInlineMsg(text) {
  const body = document.getElementById('chatBody');
  if (!body) return;
  const m = document.createElement('div');
  m.className = 'msg ai';
  m.textContent = text;
  body.appendChild(m);
  body.scrollTop = body.scrollHeight;
}

// ── NEW: Welcome overlay ──

</script>
</body>
</html>
