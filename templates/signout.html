<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jodzenix – Sign Out</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0c10; --surface: #111318; --card: #16191f;
    --border: rgba(255,255,255,0.06); --accent: #c8f04c; --accent2: #4cf0b8;
    --text: #e8eaf0; --muted: #6b7280; --danger:#ff6b6b; --sidebar-w: 240px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; display:flex; min-height:100vh; }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 500px 500px at 50% 50%, rgba(255,60,60,0.04) 0%, transparent 70%);
  }

  /* SIDEBAR */
  .sidebar { width:var(--sidebar-w); min-height:100vh; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:28px 0; position:fixed; top:0; left:0; z-index:10; }
  .logo { padding:0 24px 28px; font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:var(--text); border-bottom:1px solid var(--border); }
  .logo span { color:var(--accent); }
  .nav { padding:24px 12px; flex:1; display:flex; flex-direction:column; gap:4px; }
  .nav a { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; text-decoration:none; color:var(--muted); font-size:14px; font-weight:500; transition:all .2s; }
  .nav a:hover { background:rgba(255,255,255,0.05); color:var(--text); }
  .nav a.active { background:rgba(200,240,76,0.1); color:var(--accent); }
  .nav a .icon { font-size:17px; width:22px; text-align:center; }
  .sidebar-footer { padding:16px 12px; border-top:1px solid var(--border); }
  .sidebar-footer a { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; text-decoration:none; color:var(--danger); font-size:14px; font-weight:500; transition:all .2s; background:rgba(255,60,60,0.08); border:1px solid rgba(255,60,60,0.12); }
  .sidebar-footer a .icon { font-size:17px; width:22px; text-align:center; }

  /* MAIN */
  .main { margin-left:var(--sidebar-w); flex:1; display:flex; align-items:center; justify-content:center; padding:48px; position:relative; z-index:1; }

  /* CARD */
  .signout-card {
    background:var(--card); border:1px solid var(--border); border-radius:24px;
    padding:52px 48px; max-width:460px; width:100%; text-align:center;
    position:relative; overflow:hidden;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .signout-card::before {
    content:''; position:absolute; top:-60px; left:50%; transform:translateX(-50%);
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,60,60,0.1) 0%, transparent 70%);
    pointer-events:none; border-radius:50%;
  }

  .icon-wrap {
    width:80px; height:80px; margin:0 auto 24px;
    background:rgba(255,60,60,0.08); border:1px solid rgba(255,60,60,0.15);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:36px;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(255,107,107,0); }
    50% { box-shadow:0 0 0 14px rgba(255,107,107,0.06); }
  }

  .signout-card h2 { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; margin-bottom:12px; }
  .signout-card p { color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:32px; }

  .user-pill {
    display:inline-flex; align-items:center; gap:10px; padding:10px 18px;
    background:rgba(255,255,255,0.04); border:1px solid var(--border);
    border-radius:40px; margin-bottom:32px;
  }
  .user-pill .ava {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Syne',sans-serif; font-weight:800; font-size:13px; color:#0a0c10;
  }
  .user-pill .uname { font-size:13px; font-weight:500; }
  .user-pill .email { font-size:11px; color:var(--muted); }

  .btn-row { display:flex; gap:12px; }
  .btn-cancel {
    flex:1; padding:13px; border-radius:12px; background:rgba(255,255,255,0.04);
    border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif;
    font-size:14px; font-weight:600; cursor:pointer; transition:all .2s;
  }
  .btn-cancel:hover { background:rgba(255,255,255,0.08); }
  .btn-signout {
    flex:1; padding:13px; border-radius:12px; background:var(--danger);
    border:none; color:#fff; font-family:'Syne',sans-serif;
    font-size:14px; font-weight:700; cursor:pointer; transition:all .2s;
  }
  .btn-signout:hover { opacity:.88; transform:translateY(-1px); box-shadow:0 8px 24px rgba(255,60,60,0.25); }

  .hint { margin-top:24px; font-size:12px; color:var(--muted); }

  /* States */
  .signing-out { display:none; text-align:center; padding:20px 0; }
  .spinner {
    width:40px; height:40px; border:3px solid rgba(255,255,255,0.08);
    border-top-color:var(--danger); border-radius:50%; margin:0 auto 16px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes popIn { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">Jodze<span>nix</span></div>
  <nav class="nav">
    <a href="profile.html"><span class="icon">👤</span> Profile</a>
    <a href="settings.html"><span class="icon">⚙️</span> Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a href="#"><span class="icon">🚪</span> Sign Out</a>
  </div>
</aside>

<main class="main">
  <div class="signout-card">

    <div id="confirm-state">
      <div class="icon-wrap">🚪</div>
      <h2>Sign Out?</h2>
      <p>You're about to sign out of your Jodzenix account. Any unsaved changes will be lost.</p>

      <div class="user-pill">
        <div class="ava">J</div>
        <div>
          <div class="uname">Jodzenix User</div>
          <div class="email">user@jodzenix.dev</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-cancel" onclick="window.history.back()">Cancel</button>
        <button class="btn-signout" onclick="doSignout()">Yes, Sign Out</button>
      </div>
      <div class="hint">You'll be redirected to the login page</div>
    </div>

    <div class="signing-out" id="loading-state">
      <div class="spinner"></div>
      <p style="color:var(--muted);font-size:14px;">Signing you out securely…</p>
    </div>

  </div>
</main>

<script>
function doSignout() {
  document.getElementById('confirm-state').style.display = 'none';
  document.getElementById('loading-state').style.display = 'block';
  setTimeout(() => {
    window.location.href = window.location.href = '/';
  }, 1800);
}
</script>
</body>
</html>
